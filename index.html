<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개인 홈페이지</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        a {
            color: #fff;
            text-decoration: none;
            border-bottom: 2px solid #fff;
            transition: all 0.3s ease;
        }
        a:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>안녕하세요! 👋</h1>
        <p>이곳은 <strong>whdcjf7734-cyber</strong>님의 개인 홈페이지입니다.</p>
        <p>GitHub Pages로 무료 호스팅되었습니다.</p>
        <p><a href="https://github.com/whdcjf7734-cyber" target="_blank">GitHub 프로필 보기</a></p>
        <p style="font-size: 0.9rem; opacity: 0.8;">이 파일을 수정하여 나만의 홈페이지를 만들어 보세요!</p>
    </div>
</body>
</html>
